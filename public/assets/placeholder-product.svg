<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-label="Здесь скоро будет фотография">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafafa" />
      <stop offset="100%" stop-color="#f4f4f5" />
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4d4d8" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />
  
  <!-- Subtle Card Frame -->
  <rect x="36" y="36" width="728" height="928" rx="28" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5" />

  <!-- Perfume Bottle Illustration -->
  <g transform="translate(400, 390)">
    <!-- Aura / Shadow glow -->
    <ellipse cx="0" cy="180" rx="120" ry="24" fill="#000000" opacity="0.04" />
    
    <!-- Sprayer nozzle / neck -->
    <rect x="-18" y="-120" width="36" height="30" rx="4" fill="url(#capGrad)" />
    <!-- Spray cap -->
    <rect x="-30" y="-180" width="60" height="64" rx="8" fill="url(#capGrad)" />
    <line x1="-30" y1="-148" x2="30" y2="-148" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />

    <!-- Bottle Body (Geometric luxury glass silhouette) -->
    <rect x="-105" y="-90" width="210" height="250" rx="20" fill="url(#bottleGrad)" stroke="#d4d4d8" stroke-width="2" />
    <!-- Inner glass facet -->
    <rect x="-85" y="-70" width="170" height="210" rx="12" fill="#ffffff" opacity="0.6" stroke="#e4e4e7" stroke-width="1.5" />

    <!-- Label plaque on bottle -->
    <rect x="-60" y="-15" width="120" height="80" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.2" />
    <line x1="-36" y1="12" x2="36" y2="12" stroke="#d4d4d8" stroke-width="2" stroke-linecap="round" />
    <line x1="-24" y1="28" x2="24" y2="28" stroke="#e4e4e7" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Clean Typography -->
  <text x="400" y="650" text-anchor="middle" fill="#27272a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="-0.3">
    Здесь скоро будет фотография
  </text>
  <text x="400" y="692" text-anchor="middle" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0.2">
    Оригинальный товар · Фото перед отправкой
  </text>
</svg>
