<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maison Arôme — Оригинальная парфюмерия и распивы</title>
    <meta name="description" content="Интернет-магазин оригинальной парфюмерии Maison Arôme. Распивы от 1 мл и целые флаконы. 100% подлинность, фото перед отправкой." />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="Maison Arôme — Оригинальная парфюмерия и распивы" />
    <meta property="og:description" content="Интернет-магазин оригинальной парфюмерии Maison Arôme. Распивы от 1 мл и целые флаконы. 100% подлинность, фото перед отправкой." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;background:#ffffff;display:flex;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <header style="height:60px;border-bottom:1px solid #e4e4e7;display:flex;align-items:center;justify-content:space-between;padding:0 20px;">
          <div style="font-size:15px;letter-spacing:0.25em;text-transform:uppercase;font-weight:700;color:#09090b;">MAISON ARÔME</div>
          <div style="width:20px;height:20px;border:2px solid #e4e4e7;border-top-color:#09090b;border-radius:50%;animation:marome_spin 0.7s linear infinite;"></div>
        </header>
        <div style="flex:1;background:#09090b;padding:48px 24px;color:#ffffff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;">
          <div style="font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#d4af37;margin-bottom:12px;font-family:Georgia,serif;">Maison Arôme Atelier</div>
          <div style="font-size:22px;font-weight:400;margin-bottom:8px;font-family:Georgia,serif;">Оригинальная парфюмерия</div>
          <div style="font-size:12px;color:#a1a1aa;margin-bottom:24px;">Загрузка бутика...</div>
          <div style="height:2px;width:140px;background:#27272a;overflow:hidden;border-radius:1px;">
            <div style="height:100%;width:40%;background:#d4af37;animation:marome_load 1s ease-in-out infinite;"></div>
          </div>
        </div>
      </div>
      <style>
        @keyframes marome_spin{to{transform:rotate(360deg)}}
        @keyframes marome_load{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
