  <body>
    <div id="root">
      <div style="min-height:100vh;background:#ffffff;display:flex;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#09090b;">
        <header style="height:60px;border-bottom:1px solid #f4f4f5;display:flex;align-items:center;justify-content:center;padding:0 20px;position:relative;">
          <div style="font-size:16px;letter-spacing:0.25em;text-transform:uppercase;font-weight:700;color:#09090b;">MAISON ARÔME</div>

        <div style="flex:1;background:#fafafa;padding:60px 24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;">

          <div style="font-size:12px;color:#a1a1aa;">Загрузка каталога...</div>
        </div>
      </div>
      <style>
        @keyframes marome_spin{to{transform:rotate(360deg)}}

    </div>
