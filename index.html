<!doctype html>
<html lang="ru" style="background-color:#ffffff;color-scheme:light;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Maison Arôme — Оригинальная парфюмерия и распивы</title>
    <meta name="description" content="Интернет-магазин оригинальной парфюмерии Maison Arôme. Распивы от 1 мл и целые флаконы. 100% подлинность, фото перед отправкой." />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="Maison Arôme — Оригинальная парфюмерия и распивы" />
    <meta property="og:description" content="Интернет-магазин оригинальной парфюмерии Maison Arôme. Распивы от 1 мл и целые флаконы. 100% подлинность, фото перед отправкой." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      html, body {
        background-color: #ffffff !important;
        color: #09090b !important;
        margin: 0;
        padding: 0;
      }
    </style>
    <script>
      window.__marome_loaded = false;

      // Handle Safari bfcache (back-forward cache) frozen restore
      window.addEventListener('pageshow', function(e) {
        if (e.persisted && !window.__marome_loaded) {
          window.location.reload();
        }
      });

      // Catch global JS errors
      window.addEventListener('error', function(e) {
        try {
          var payload = JSON.stringify({
            t: 'err',
            msg: e.message || 'Error',
            src: e.filename || (e.target && (e.target.src || e.target.href)) || '',
            line: e.lineno,
            col: e.colno,
            ua: navigator.userAgent
          });
          if (navigator.sendBeacon) {
            navigator.sendBeacon('/api/client-error', payload);
          }
        } catch(i){}
      }, true);

      // 6-second timeout fallback: if React didn't boot, let the user reload immediately
      setTimeout(function() {
        if (!window.__marome_loaded) {
          try {
            if (navigator.sendBeacon) {
              navigator.sendBeacon('/api/client-error', JSON.stringify({
                t: 'timeout',
                msg: 'React boot timeout > 6s',
                ua: navigator.userAgent
              }));
            }
          } catch(i){}
          var el = document.getElementById('marome_status');
          if (el) {
            el.innerHTML = '<div style="margin-top:12px;"><div style="color:#71717a;font-size:12px;margin-bottom:8px;">Загрузка занимает дольше обычного</div><button onclick="window.location.reload(true)" style="padding:10px 20px;background:#09090b;color:#ffffff;border:none;font-size:11px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;">Обновить витрину</button></div>';
          }
        }
      }, 6000);
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;background:#ffffff;display:flex;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#09090b;">
        <header style="height:60px;border-bottom:1px solid #f4f4f5;display:flex;align-items:center;justify-content:center;padding:0 20px;position:relative;">
          <div style="font-size:16px;letter-spacing:0.25em;text-transform:uppercase;font-weight:700;color:#09090b;">MAISON ARÔME</div>
        </header>
        <div style="flex:1;background:#fafafa;padding:60px 24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;">
          <div style="width:36px;height:36px;border:2.5px solid #e4e4e7;border-top-color:#09090b;border-radius:50%;animation:marome_spin 0.8s linear infinite;margin-bottom:20px;"></div>
          <div style="font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#71717a;margin-bottom:6px;">Maison Arôme Atelier</div>
          <div style="font-size:18px;font-weight:500;color:#09090b;margin-bottom:4px;font-family:Georgia,serif;">Оригинальная парфюмерия</div>
          <div id="marome_status" style="font-size:12px;color:#a1a1aa;">Загрузка каталога...</div>
        </div>
      </div>
      <style>
        @keyframes marome_spin{to{transform:rotate(360deg)}}
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
